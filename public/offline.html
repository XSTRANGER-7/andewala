<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4d3f">
<title>You're offline · AndeWala</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7faf8; color: #17231e; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px; box-sizing: border-box; text-align: center; }
  img { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 10px 24px -10px rgb(31 77 63 / .5); }
  h1 { font-size: 24px; margin: 20px 0 6px; }
  p { color: #4a5a53; margin: 0 auto 20px; max-width: 320px; line-height: 1.5; }
  button { font: inherit; font-weight: 700; color: #fff; background: #1f4d3f; border: 0; border-radius: 12px; padding: 14px 24px; cursor: pointer; }
</style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>AndeWala needs an internet connection to show today's price and take your order. Your cart is saved.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
